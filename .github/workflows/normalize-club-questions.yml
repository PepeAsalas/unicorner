name: Normalize club questions

on:
  workflow_dispatch:
  push:
    paths:
      - 'daily/*.json'
      - 'scripts/question_intake_*.json'
      - 'scripts/normalize_club_questions.py'
      - '.github/workflows/normalize-club-questions.yml'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Normalize club questions
        run: python scripts/normalize_club_questions.py
      - name: Validate club question wording and types
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          files = list(Path('daily').glob('*.json')) + list(Path('scripts').glob('question_intake_*.json'))
          for path in files:
              data = json.loads(path.read_text(encoding='utf-8'))
              for q in data.get('questions', []):
                  if q.get('answer_type') == 'club':
                      assert q.get('prompt', '').lower().startswith('name a club'), (path, q.get('id'), q.get('prompt'))

          today = json.loads(Path('daily/2026-09-23.json').read_text(encoding='utf-8'))
          c003 = next(q for q in today['questions'] if (q.get('id') or q.get('_id')) == 'c003')
          assert c003['answer_type'] == 'club'
          assert c003['prompt'].startswith('Name a club')
          PY
      - name: Commit normalized questions
        run: |
          if git diff --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '418982418+github-actions[bot]@users.noreply.github.com'
          git add daily/*.json scripts/question_intake_*.json
          git commit -m 'Clarify club-answer questions'
          git push
