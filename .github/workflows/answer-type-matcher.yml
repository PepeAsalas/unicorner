name: Answer type matcher

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/answer_type_matcher_trigger.txt'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply answer type matcher
        run: python scripts/add_answer_type_matcher.py
      - name: Validate JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=list(re.finditer(r'<script([^>]*)>(.*?)</script>',s,re.S|re.I))
          js='\n;\n'.join(m.group(2) for m in scripts if 'application/json' not in m.group(1))
          Path('/tmp/unicorner.js').write_text(js,encoding='utf-8')
          PY
          node --check /tmp/unicorner.js
      - name: Run matcher regression tests
        run: python scripts/test_answer_type_matching.py
      - name: Validate RETRO answer types
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          files=sorted(Path('scripts').glob('question_intake_2026-09-22_retro_r*.json'))
          qs=[]
          for p in files:
              qs += json.loads(p.read_text(encoding='utf-8')).get('questions',[])
          target=[q for q in qs if (q.get('id') or q.get('_id','')).startswith('r')]
          assert len(target)>=20
          assert all(q.get('answer_type') in {'player','club'} for q in target[:20])
          clubs={'r001','r002','r003','r011','r012','r013'}
          byid={(q.get('id') or q.get('_id')):q for q in target}
          for qid in clubs: assert byid[qid]['answer_type']=='club'
          for qid in set(f'r{i:03d}' for i in range(1,21))-clubs: assert byid[qid]['answer_type']=='player'
          print('RETRO answer_type validation passed')
          PY
      - name: Commit matcher update
        run: |
          if git diff --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '418982418+github-actions[bot]@users.noreply.github.com'
          git add index.html scripts/question_intake_2026-09-22_retro_r001_r005.json scripts/question_intake_2026-09-22_retro_r006_r010.json scripts/question_intake_2026-09-22_retro_r011_r015.json scripts/question_intake_2026-09-22_retro_r016_r020.json
          git commit -m 'Support typed answers beyond players'
          git push
