# Monday: email the Instagram post brief (Hall of Fame, Screamer, Week in numbers) for the week that just ended.
# Needs the GitHub secrets SUPABASE_SERVICE_ROLE_KEY, RESEND_API_KEY and SOCIAL_EMAIL_TO (SOCIAL_EMAIL_FROM optional),
# and supabase/social_weekly.sql run once in Supabase. Run it by hand from the Actions tab to test.
name: Weekly social email

on:
  schedule:
    - cron: '43 6 * * 1'   # Monday morning, Amsterdam time
  workflow_dispatch:
    inputs:
      week:
        description: 'Monday of the week (YYYY-MM-DD). Empty = last week'
        required: false
      dry_run:
        description: 'Only check the data works, do not send the email'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  email:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Send the Monday post email
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SOCIAL_EMAIL_TO: ${{ secrets.SOCIAL_EMAIL_TO }}
          SOCIAL_EMAIL_FROM: ${{ secrets.SOCIAL_EMAIL_FROM }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            # the log is public (public repo): only show that the data loaded, not the email itself
            python scripts/weekly_social.py --dry-run ${{ github.event.inputs.week }} > /dev/null && echo 'data OK, email not sent'
          else
            python scripts/weekly_social.py ${{ github.event.inputs.week }}
          fi
