name: Apply Unicorner upgrade

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply-unicorner-upgrade.yml'
      - 'scripts/apply_privacy_upgrade.py'
      - 'scripts/apply_analytics_upgrade.py'
      - 'scripts/apply_daily_schedule.py'
      - 'scripts/schedule_payload/**'
      - 'scripts/schedule_extras.json'

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply analytics/auth/scoring upgrade
        run: python scripts/apply_analytics_upgrade.py
      - name: Apply privacy upgrade
        run: python scripts/apply_privacy_upgrade.py
      - name: Apply frozen daily schedule
        run: python scripts/apply_daily_schedule.py
      - name: Validate scheduled games
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path
          expected=[f'2026-09-{day:02d}' for day in range(18,27)]
          seen=set()
          for day in expected:
              p=Path('daily')/f'{day}.json'
              d=json.loads(p.read_text(encoding='utf-8'))
              assert d['date']==day
              questions=d['questions']
              assert len(questions)==5, day
              assert sum(q['difficulty']=='easy' for q in questions)==4, day
              assert sum(q['difficulty']=='medium' for q in questions)==1, day
              families=[]
              for q in questions:
                  qid=q.get('id') or q.get('_id')
                  assert qid not in seen, (day,'repeat',qid)
                  seen.add(qid)
                  assert q.get('scoring_version')==2, (day,qid)
                  assert q.get('format_family'), (day,qid,'missing format family')
                  families.append(q['format_family'])
                  assert any(int(a['fame'])==1 for a in q['answers']), (day,qid)
                  assert {int(a['fame']) for a in q['answers']}=={1,2,3,4,5,6}, (day,qid)
              assert max(Counter(families).values())<=2, (day,Counter(families))
          assert len(seen)==45
          PY
      - name: Validate JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=list(re.finditer(r'<script([^>]*)>(.*?)</script>',s,re.S|re.I))
          js='\n;\n'.join(m.group(2) for m in scripts if 'application/json' not in m.group(1))
          Path('/tmp/unicorner.js').write_text(js,encoding='utf-8')
          PY
          node --check /tmp/unicorner.js
      - name: Commit upgraded site
        run: |
          if git diff --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html privacy.html daily
          git commit -m 'Rebalance daily question formats'
          git push
