name: Apply Unicorner upgrade

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply-unicorner-upgrade.yml'
      - 'scripts/apply_privacy_upgrade.py'
      - 'scripts/apply_analytics_upgrade.py'

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply analytics/auth/scoring upgrade
        run: python scripts/apply_analytics_upgrade.py
      - name: Apply privacy upgrade
        run: python scripts/apply_privacy_upgrade.py
      - name: Validate JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s = Path('index.html').read_text(encoding='utf-8')
          scripts = list(re.finditer(r'<script([^>]*)>(.*?)</script>', s, re.S | re.I))
          js = '\n;\n'.join(m.group(2) for m in scripts if 'application/json' not in m.group(1))
          Path('/tmp/unicorner.js').write_text(js, encoding='utf-8')
          PY
          node --check /tmp/unicorner.js
      - name: Commit upgraded site
        run: |
          if git diff --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html privacy.html
          git commit -m 'Add privacy policy and consent records'
          git push
