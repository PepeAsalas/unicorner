name: Set timer to 30 seconds
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  update:
    if: contains(github.event.head_commit.message, 'Add timer migration workflow')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update timer
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("index.html")
          s = p.read_text()
          old = "const TIME=25"
          new = "const TIME=30"
          if old not in s:
              raise SystemExit("timer constant not found")
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit timer change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Increase question timer to 30 seconds"
          git push
