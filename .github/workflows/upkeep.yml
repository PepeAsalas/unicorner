name: Upkeep

# Daily: health check of the schedule and live site, and fresh sitemap dates.
# Friday: saves the week's rejected daily-game answers for the Saturday routine to review.
# Monday: weekly report as a GitHub issue (GitHub emails it to the owner).
# Sunday night: moves events older than 21 days to private Supabase Storage (bucket events-archive) and
# deletes them from the database. Needs the repository secret SUPABASE_SERVICE_ROLE_KEY.
on:
  workflow_dispatch:
    inputs:
      job:
        description: 'health, rejections, report, archive or archive-dry-run'
        default: health
  schedule:
    - cron: '41 4 * * *'   # health, every day
    - cron: '13 20 * * 5'  # rejections, Friday evening
    - cron: '13 6 * * 1'   # report, Monday morning
    - cron: '27 2 * * 0'   # archive, Sunday night

permissions:
  contents: write
  issues: write
  actions: read

concurrency:
  group: upkeep
  cancel-in-progress: false

jobs:
  upkeep:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      JOB: ${{ github.event.inputs.job || (github.event.schedule == '13 20 * * 5' && 'rejections') || (github.event.schedule == '13 6 * * 1' && 'report') || (github.event.schedule == '27 2 * * 0' && 'archive') || 'health' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: git config user.name 'github-actions[bot]' && git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Health check
        if: env.JOB == 'health'
        id: health
        continue-on-error: true
        run: python scripts/upkeep.py health | tee health.txt
      - name: Build the past answers page
        if: env.JOB == 'health'
        run: python scripts/build_answers.py && python scripts/build_trivia.py
      - name: Commit sitemap dates and answers page
        if: env.JOB == 'health'
        run: |
          git add sitemap.xml answers/ football-trivia-questions/
          if ! git diff --cached --quiet; then git commit -m 'Refresh sitemap dates and past answers' && git pull --rebase origin main && git push origin HEAD:main; fi
      - name: Report a failed health check
        if: env.JOB == 'health' && steps.health.outcome == 'failure'
        run: |
          printf '@%s the daily health check found a problem:\n\n%s\n\nForward this to Claude to fix.\n' "$GITHUB_REPOSITORY_OWNER" "$(cat health.txt)" > body.md
          gh issue create --title "⚠️ Unicorner health check failed ($(date -u +%F))" --body-file body.md
          exit 1

      - name: Save rejected answers
        if: env.JOB == 'rejections'
        run: |
          python scripts/upkeep.py rejections
          git add daily/rejections && (git diff --cached --quiet || (git commit -m 'Save this week'"'"'s rejected daily answers' && git pull --rebase origin main && git push origin HEAD:main))

      - name: Weekly report
        if: env.JOB == 'report'
        run: |
          python scripts/upkeep.py report > report.md
          since=$(date -u -d '7 days ago' +%FT%TZ)
          fails=$(gh run list --limit 100 --json name,conclusion,createdAt,url --jq "[.[] | select(.createdAt > \"$since\" and .conclusion == \"failure\")] | map(\"- \(.name): \(.url)\") | .[]" || true)
          { echo '### Automations'; echo; if [ -n "$fails" ]; then echo 'These failed this week:'; echo "$fails"; else echo 'Everything ran without failures. ✅'; fi; echo; echo "@$GITHUB_REPOSITORY_OWNER"; } >> report.md
          for n in $(gh issue list --label weekly-report --state open --json number --jq '.[].number'); do gh issue close "$n"; done
          gh label create weekly-report --color FBF3DC --force >/dev/null 2>&1 || true
          gh issue create --title "📊 Unicorner weekly report ($(date -u +%F))" --label weekly-report --body-file report.md

      - name: Archive old events
        if: env.JOB == 'archive' || env.JOB == 'archive-dry-run'
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/archive_events.py ${{ env.JOB == 'archive-dry-run' && '--dry-run' || '' }}
