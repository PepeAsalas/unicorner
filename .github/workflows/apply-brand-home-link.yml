name: Apply brand home link

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply-brand-home-link.yml'
      - 'scripts/apply_brand_home_link.py'
      - 'scripts/normalize_tier_labels.py'
      - 'scripts/refine_landing_podium.py'
      - 'scripts/widen_desktop_layout.py'
      - 'scripts/reorder_landing_sections.py'
      - 'scripts/combine_played_results_card.py'
      - 'scripts/restructure_results_screen.py'
      - 'scripts/refine_completed_landing_mobile.py'
      - 'scripts/rebuild_landing_dashboard.py'
      - 'scripts/replace_streak_emoji.py'
      - 'scripts/push_title_into_unicorn.py'
      - 'scripts/add_non_game_close.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply landing and game UI changes
        run: |
          if grep -q '/\* result screen social loop \*/' index.html; then
            echo 'Brand/tier fixes are already baked into the current social results layout'
          else
            python scripts/apply_brand_home_link.py
          fi
          python scripts/normalize_tier_labels.py
          python scripts/refine_landing_podium.py
          python scripts/widen_desktop_layout.py
          python scripts/reorder_landing_sections.py
          python scripts/combine_played_results_card.py
          python scripts/restructure_results_screen.py
          python scripts/refine_completed_landing_mobile.py
          python scripts/rebuild_landing_dashboard.py
          python scripts/replace_streak_emoji.py
          python scripts/push_title_into_unicorn.py
          python scripts/add_non_game_close.py
      - name: Validate behavior
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          assert 'id="brand-home"' in s
          assert "document.body.classList.contains('playing')" in s
          assert "track('home_click',{from:'brand'" in s
          assert "brandHome.addEventListener('click',goBrandHome)" in s
          assert "const TIERS=[[20,'Tap-in'],[40,'Header'],[60,'Volley'],[80,'Bicycle kick'],[100,'Screamer']];" in s
          assert 'class="lp-ans uni podium-top"' in s
          assert '<b>Héctor Bellerín</b><span>Volley · 60</span>' in s
          assert '<b>Thomas Vermaelen</b><span>Screamer · 100</span>' in s
          assert '<b>Alexis Sánchez</b><span>Tap-in · 20</span>' in s
          assert 'screamerTierPulse' in s
          assert 'SCREAMER!!!' in s
          assert '/* aligned landing podium */' in s
          assert '.landing-wrap .lp-example .lp-answers{align-items:end!important;gap:16px!important' in s
          assert '.landing-wrap .lp-example .podium-low{height:96px!important}' in s
          assert '.landing-wrap .lp-example .podium-mid{height:116px!important}' in s
          assert '.landing-wrap .lp-example .podium-top{height:140px!important;transform:none!important}' in s
          assert '/* wider desktop layout */' in s
          assert '.wrap{max-width:773px!important}' in s
          steps_pos=s.find('<section class="lp-steps" id="steps">')
          example_pos=s.find('<section class="lp-example card">')
          assert steps_pos >= 0 and example_pos >= 0 and steps_pos < example_pos
          assert '/* played result launch card */' in s
          assert 'class="played-box played-result-card"' in s
          assert '<details class="played-box played-results-box">' not in s
          assert 'View today\'s result' in s
          assert 'Score, rank & answers' in s
          assert 'function landingResultsMarkup(p)' not in s
          assert "const go=document.getElementById('go');if(go)go.onclick=play;" in s
          assert '/* completed landing mobile refinements */' in s
          assert 'class="lp-final lp-final-played"' in s
          assert 'Want more? Play as many rounds as you like, whenever you like.' not in s
          assert '.landing-wrap .lp-tiers .tier-chip b{min-height:34px!important' in s
          played_final=s.find('class="lp-final lp-final-played"')
          assert played_final >= 0 and steps_pos >= 0 and played_final < steps_pos
          assert '/* compact landing dashboard */' in s
          hero_pos=s.find('class="lp-hero lp-home-hero"')
          daily_pos=s.find('class="card lp-home-daily"')
          infinite_pos=s.find('class="lp-final lp-final-played" data-home-infinite')
          assert min(hero_pos,daily_pos,infinite_pos,steps_pos) >= 0
          assert hero_pos < daily_pos < infinite_pos < steps_pos
          assert 'class="lp-daily-actions"' in s
          assert 'Play today\'s game' in s and 'How it works' in s
          assert 'Today\'s final whistle' in s and 'View today\'s result' in s
          assert '∞ Try Infinite mode' in s
          assert '/* pixel streak flame */' in s
          assert 'class="pixel-flame"' in s
          assert '🔥' not in s
          assert '/* title overlaps unicorn space */' in s
          assert 'width:calc(100% - 6px)!important' in s
          assert 'transform:translateX(12px)!important' in s
          assert '/* quick non-game home exit */' in s
          assert '<div class="card result-screen"><button type="button" class="quick-home-x" id="quick-home-x"' in s
          assert '.result-screen .quick-home-x{display:flex;position:absolute;top:14px;right:14px' in s
          assert 'body.playing .quick-home-x{display:none!important}' in s
          assert s.count('id="quick-home-x"') == 1
          assert "track('home_click',{from:'quick_exit'" in s
          assert '/* result screen social loop */' in s
          assert 'Your match highlights' in s
          assert 'Nearly had it' in s
          assert 'Unicorner progress' in s
          assert 'Challenge a mate while the result is fresh.' in s
          assert "misses.length===1?'1 answer':misses.length+' answers'" in s
          result_share=s.find('id="share-result"')
          result_highlights=s.find('Your match highlights')
          assert result_share >= 0 and result_highlights >= 0 and result_share < result_highlights
          assert 'Better than ${pct.textContent}% of players' in s
          for old in ('fin'+'ish','ban'+'ger','wor'+'ldie'):
              assert not re.search(rf'\b{old}\b', s, re.I)
          scripts=list(re.finditer(r'<script([^>]*)>(.*?)</script>',s,re.S|re.I))
          js='\n;\n'.join(m.group(2) for m in scripts if 'application/json' not in m.group(1))
          Path('/tmp/unicorner.js').write_text(js,encoding='utf-8')
          PY
          node --check /tmp/unicorner.js
      - name: Commit site change
        run: |
          if git diff --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '418982418+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Position results close inside result card'
          git push
