<!doctype html><html><head><meta charset="utf-8"><title>Email art</title>
<style>
@font-face{font-family:'Jersey 10';src:url(/fonts/jersey10.woff2) format('woff2')}
@font-face{font-family:'VT323';src:url(/fonts/vt323.woff2) format('woff2')}
body{margin:0;background:#333;padding:20px;display:grid;gap:20px;justify-content:start}
.hd{position:relative;width:600px;height:300px;overflow:hidden;background:#2e8a45 url(/bg/pitch-wide.webp) center/cover;border:0}
.hd:before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,20,40,.25),rgba(10,20,40,.55))}
.logo{position:absolute;left:50%;top:26px;transform:translateX(-50%);background:#fff6dc;border:4px solid #000;box-shadow:6px 6px 0 #000;font:400 40px/1 'Jersey 10';letter-spacing:3px;color:#1d1a2b;padding:10px 20px 4px}
.uni{position:absolute;left:50%;top:104px;width:168px;height:140px;transform:translateX(-62%);background:center/contain no-repeat;image-rendering:pixelated;filter:drop-shadow(6px 6px 0 rgba(0,0,0,.45))}
.hey{position:absolute;left:0;right:0;bottom:16px;text-align:center;font:400 54px/1 'Jersey 10';color:#f2c230;text-shadow:5px 5px 0 #000;letter-spacing:1px}
.card{width:548px;height:104px;box-sizing:border-box;background:#fff6dc;border:4px solid #000;box-shadow:6px 6px 0 #000;display:flex;align-items:center;gap:16px;padding:0 18px;margin:0 6px 6px 0}
.card img{width:64px;height:64px;flex:none}
.card b{display:block;font:400 34px/1 'Jersey 10';color:#1e3f8a;letter-spacing:.5px}
.card span{display:block;font:400 22px/1.1 'VT323';color:#1d1a2b;margin-top:4px}
.card i{font-style:normal;font:400 16px/1 'Jersey 10';background:#e04848;color:#fff;padding:4px 6px 1px;margin-left:10px;vertical-align:6px;border:2px solid #000}
.wrap{padding:0 6px 6px 0;background:transparent;width:max-content}
</style></head><body>
<div class="hd" id="header"><div class="logo">UNICORNER</div><div class="uni" id="uni"></div><div class="hey">HEY FOOTBALL FAN!</div></div>
<div class="wrap" id="c-daily"><div class="card"><img src="/levels/6.png" alt=""><div><b>DAILY 5</b><span>The rarer your answer, the more points you earn.</span></div></div></div>
<div class="wrap" id="c-rosco"><div class="card"><img src="/icons/book.png" alt=""><div><b>ROSCO</b><span>Can you complete the football alphabet?</span></div></div></div>
<div class="wrap" id="c-millions"><div class="card"><img src="/icons/money.png" alt=""><div><b>MILLIONS</b><span>Can you keep your million?</span></div></div></div>
<div class="wrap" id="c-stable"><div class="card"><img src="/icons/medal-gold.png" alt=""><div><b>STABLE HAND<i>NEW</i></b><span>Football blackjack: get close without going bust.</span></div></div></div>
<script src="/duel/sprites.js"></script>
<script>document.getElementById('uni').style.backgroundImage=spriteDraw('happy',0,false,null);Promise.all([...document.images].map(i=>i.decode().catch(()=>{}))).then(()=>document.fonts.ready).then(()=>document.body.dataset.ready=1)</script>
</body></html>
