<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hunter Douglas City</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&family=Roboto:wght@300;400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="scene"></canvas>
  <div id="labels"></div>

  <header class="topbar">
    <div class="brandmark">
      <img src="assets/logos/hunter-douglas.png" alt="Hunter Douglas Architectural">
    </div>
    <div class="intro" id="intro">
      <h1 id="title"></h1>
      <p id="subtitle"></p>
    </div>
  </header>

  <nav class="legend" aria-label="Materials">
    <span class="legend-label">Materials</span>
    <button type="button" class="chip derako" data-brand="derako" aria-label="Derako material specs"><img src="assets/logos/derako.png" alt="Derako"></button>
    <button type="button" class="chip heartfelt" data-brand="heartfelt" aria-label="HeartFelt material specs"><img src="assets/logos/heartfelt.png" alt="HeartFelt"></button>
    <button type="button" class="chip luxalon" data-brand="luxalon" aria-label="Luxalon material specs"><img src="assets/logos/luxalon.png" alt="Luxalon"></button>
  </nav>

  <button class="back" id="back" type="button" aria-label="Back to city">
    <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3 5 8l5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    City
  </button>

  <aside class="panel" id="panel" aria-live="polite"></aside>

  <div class="viewer" id="viewer" role="dialog" aria-modal="true" aria-label="Project"></div>
  <div class="material" id="material" role="dialog" aria-modal="true" aria-label="Material"></div>

  <p class="hint">Click a building or a material · ← → to move · Esc to go back</p>

  <script src="vendor/three.min.js"></script>
  <script src="content.js"></script>
  <script src="city.js"></script>
</body>
</html>
