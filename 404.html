<title>Unicorner</title>
<script>
// A sign-in link can arrive as /&token_hash=… when the link it was built from had no "?": send it to the game with the right query
(function(){var p=location.pathname,i=p.indexOf('&');if(i<0)return;
 var q=p.slice(i+1)+(location.search?'&'+location.search.slice(1):'');
 location.replace(p.slice(0,i).replace(/[^\/]*$/,'')+'?'+q+location.hash)})();
</script>
