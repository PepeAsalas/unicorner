<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Scoreboard reveals</title>
<link href="https://fonts.googleapis.com/css2?family=Jersey+10&family=VT323&display=swap" rel="stylesheet">
<script src="/duel/sprites.js"></script>
<style>
:root{--blue:#1d4486;--blue2:#173a75;--blue3:#2a56a3;--ink:#1d1a2b;--black:#0d0c13;--bezel:#2a2638;--cream:#fbf6e8;--mute:#b9c5e6;--gold:#f2c230;
 --t0:#c9cde0;--t1:#3fd17f;--t2:#3fb1ff;--t3:#a070ff;--t4:#f2c230;--s1:8px;--s2:16px;--s3:24px}
*{box-sizing:border-box}
body{margin:0;background:#2a6b3a;color:var(--cream);font:400 20px/1.25 VT323,monospace;padding:20px 16px 60px}
h1{font:400 42px/1 'Jersey 10',sans-serif;color:var(--gold);margin:0 0 6px;text-shadow:3px 3px 0 #000}
.lead{color:#e3f3e7;max-width:900px;margin:0 0 20px;font-size:19px}
.row{display:flex;flex-wrap:wrap;gap:28px;align-items:flex-start}
.col{width:390px;max-width:100%}
.col>h2{font:400 28px/1 'Jersey 10',sans-serif;margin:0 0 4px;text-shadow:2px 2px 0 #000}.col>p{margin:0 0 10px;color:#e3f3e7;font-size:18px;min-height:88px}
.ctrl{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin:0 0 10px}
.ctrl button{font:400 15px/1 'Jersey 10',sans-serif;min-height:40px;border:2px solid #000;background:var(--cream);color:var(--ink);box-shadow:0 3px 0 #000;cursor:pointer;padding:0}
.ctrl button:active{transform:translateY(2px);box-shadow:0 1px 0 #000}.ctrl button:last-child{background:var(--gold)}
.phone{position:relative;display:flex;flex-direction:column;height:640px;border:4px solid #000;box-shadow:8px 8px 0 rgba(0,0,0,.35);overflow:hidden;background:var(--blue)}
.uni{background-size:contain;background-repeat:no-repeat;background-position:bottom center;image-rendering:pixelated}
.px{position:absolute;width:6px;height:6px;pointer-events:none;z-index:9}
.shake1{animation:sh1 .16s steps(2)}.shake2{animation:sh2 .22s steps(3)}.shake3{animation:sh3 .36s steps(4)}
@keyframes sh1{50%{transform:translate(1px,-1px)}}@keyframes sh2{33%{transform:translate(2px,-2px)}66%{transform:translate(-2px,1px)}}
@keyframes sh3{25%{transform:translate(6px,-4px)}50%{transform:translate(-5px,3px)}75%{transform:translate(3px,3px)}}
/* shared: question header in the site's style */
.qh{padding:var(--s2) var(--s2) 0}
.chip{display:inline-flex;align-items:center;gap:8px;background:#000;border:3px solid var(--gold);padding:6px 10px 4px;font:400 18px/1 'Jersey 10',sans-serif;box-shadow:0 3px 0 rgba(0,0,0,.4)}
.chip small{font-size:13px;color:var(--gold);letter-spacing:1px}
.q{margin:12px 0 0;font:400 22px/1.05 'Jersey 10',sans-serif}
.a{margin:6px 0 0;font:400 17px/1.2 VT323,monospace;color:var(--mute)}.a b{color:var(--cream);font-weight:400;font-size:20px}
.lbl{font:400 14px/1 'Jersey 10',sans-serif;letter-spacing:1.5px;color:var(--mute)}
.nxt{margin:auto var(--s2) var(--s2);flex:none;height:52px;border:3px solid #000;background:var(--gold);box-shadow:0 4px 0 #000;font:400 24px/1 'Jersey 10',sans-serif;color:var(--ink);opacity:0;cursor:pointer}
/* reels */
.reels{display:flex;align-items:flex-end;justify-content:center;gap:6px}
.reel{overflow:hidden;position:relative;background:#15131d;border:2px solid var(--bezel)}
.reel::after{content:'';position:absolute;inset:0;background:linear-gradient(rgba(0,0,0,.55),transparent 30%,transparent 70%,rgba(0,0,0,.55));pointer-events:none}
.reel .st{display:flex;flex-direction:column;transition:transform 90ms linear}
.reel .st span{display:grid;place-items:center;font-family:'Jersey 10',sans-serif;color:var(--gold);text-shadow:0 0 12px rgba(242,194,48,.45)}
.reel.off .st{opacity:.16}
.sep{font:400 60px/1 'Jersey 10',sans-serif;color:var(--gold)}
/* split flaps */
.flap{display:flex;justify-content:center;gap:3px}
.flap span{display:grid;place-items:center;background:#1b1926;border:2px solid var(--bezel);font-family:'Jersey 10',sans-serif;color:var(--cream);position:relative}
.flap span::after{content:'';position:absolute;left:0;right:0;top:50%;height:2px;background:#000}
.board{border:4px solid #000;background:var(--black);box-shadow:inset 0 0 0 3px var(--bezel),0 5px 0 rgba(0,0,0,.35);padding:var(--s2)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:var(--s1)}
.tile{border:3px solid #000;background:var(--blue2);padding:10px 14px}
.tile b{display:block;font:400 32px/1 'Jersey 10',sans-serif;font-weight:400;margin-top:6px}

/* ===== C1 Classic on blue ===== */
#S1 .bw{position:relative;margin:auto var(--s2) 0;padding-top:44px}#S1 .uni-s{top:-2px!important}
#S1 .uni-s{position:absolute;right:10px;top:-46px;width:56px;height:47px}
#S1 .reel{width:62px;height:100px}#S1 .reel .st span{height:100px;font-size:96px}
#S1 .flap span{width:34px;height:50px;font-size:36px}
#S1 .tiles{margin:var(--s2) var(--s2) 0}

/* ===== C2 Jumbotron ===== */
#S2 .jt{position:relative;margin:auto var(--s2) 0;border:5px solid #000;background:#0a0910;box-shadow:inset 0 0 0 4px #3a3550,0 6px 0 rgba(0,0,0,.35);padding:14px 14px 12px}
#S2 .jt::before,#S2 .jt::after{content:'';position:absolute;top:-14px;width:10px;height:14px;background:#000}
#S2 .jt::before{left:30px}#S2 .jt::after{right:30px}
#S2 .uni-s{position:absolute;left:50%;top:-60px;width:66px;height:55px;margin-left:-33px}
.led{font:400 112px/.9 'Jersey 10',sans-serif;color:var(--gold);text-align:center;letter-spacing:2px;
 -webkit-mask:radial-gradient(circle,#000 58%,transparent 62%) 0 0/5px 5px;mask:radial-gradient(circle,#000 58%,transparent 62%) 0 0/5px 5px;filter:drop-shadow(0 0 6px rgba(242,194,48,.6));font-variant-numeric:tabular-nums}
.led small{font-size:56px}
.marq{height:56px;overflow:hidden;position:relative;border-top:2px solid #26223a;margin-top:8px}
.marq div{position:absolute;left:0;top:4px;white-space:nowrap;font:400 50px/1 'Jersey 10',sans-serif;color:var(--cream);-webkit-mask:radial-gradient(circle,#000 58%,transparent 62%) 0 0/4px 4px;mask:radial-gradient(circle,#000 58%,transparent 62%) 0 0/4px 4px}
#S2 .jlab{text-align:center;margin-top:2px}
#S2 .under{display:grid;grid-template-columns:1fr auto;align-items:end;margin:var(--s2) var(--s2) 0;gap:var(--s1)}
#S2 .under .pt{font:400 52px/.9 'Jersey 10',sans-serif;color:var(--gold);text-shadow:3px 3px 0 #000;opacity:0}
#S2 .under .why{font-size:18px;color:var(--mute);opacity:0}

/* ===== C3 Departure board ===== */
#S3 .dep{position:relative;margin:44px var(--s2) 0;padding:12px}
#S3 .uni-s{position:absolute;right:10px;top:-46px;width:56px;height:47px}
#S3 .dh{display:grid;grid-template-columns:1fr 54px 40px 92px;gap:6px;padding:0 2px 6px;border-bottom:2px solid #26223a}
#S3 .dr{display:grid;grid-template-columns:1fr 54px 40px 92px;gap:6px;align-items:center;height:44px;padding:0 2px;border-bottom:1px solid #1d1a29}
#S3 .dr .tn{font:400 22px/1 'Jersey 10',sans-serif;color:#5d5776}
#S3 .dr .th,#S3 .dr .pv{font:400 18px/1 VT323,monospace;color:#5d5776}
#S3 .dr .stt .flap{justify-content:flex-start;gap:2px}#S3 .dr .stt .flap span{width:14px;height:24px;font-size:17px;border-width:1px}
#S3 .dr.on .tn{color:var(--c)}#S3 .dr.on .th,#S3 .dr.on .pv{color:var(--cream)}
#S3 .dr.goal{background:rgba(242,194,48,.12)}
#S3 .pr{display:flex;align-items:center;justify-content:space-between;margin:var(--s2) var(--s2) 0}
#S3 .reel{width:40px;height:62px}#S3 .reel .st span{height:62px;font-size:58px}#S3 .sep{font-size:40px}

/* ===== C4 Light board ===== */
#S4 .lb{position:relative;margin:auto var(--s2) 0;border:4px solid #000;background:var(--cream);box-shadow:0 5px 0 rgba(0,0,0,.35);padding:14px}
#S4 .uni-s{position:absolute;left:12px;top:-46px;width:56px;height:47px}
#S4 .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#S4 .cell{text-align:center}#S4 .cell .lbl{color:#6a6480;display:block;margin-bottom:8px}
#S4 .reel{width:40px;height:66px;background:var(--ink);border-color:#000}#S4 .reel .st span{height:66px;font-size:60px;color:var(--cream);text-shadow:none}
#S4 .reel.gold .st span{color:var(--gold)}
#S4 .sep{font-size:44px;color:var(--ink)}
#S4 .flap{margin-top:14px}#S4 .flap span{width:30px;height:46px;font-size:34px;background:var(--ink);border-color:#000}
#S4 .why{margin:var(--s2) var(--s2) 0;font-size:18px;color:var(--mute);opacity:0}
@media (prefers-reduced-motion:reduce){.shake1,.shake2,.shake3{animation:none}.reel .st{transition:none}}
</style></head><body>
<h1>Scoreboard · 4 variations</h1>
<p class="lead">All four use the scoreboard idea from C, now on the site's blue card. The percentage counts down, stalls just before Screamer, then breaks through. Example answer: Luis Suárez. Unicorn kit: Inferno.</p>
<div class="row" id="row"></div>
<template id="qh"><div class="qh"><div class="chip"><small>QUESTION</small>3 OF 5</div><p class="q">Named in Uruguay's 2010 World Cup squad</p><p class="a">You said <b>Luis Suárez</b></p></div></template>
<script>
for(let f=0;f<FRAMES.length;f++)FRAMES[f]=FRAMES[f].map((r,y)=>y>=21?r.slice(0,27)+'.'.repeat(r.length-27):r);
const KIT=KITS.find(k=>k.id==='inferno');const spr=(m,f=0)=>spriteDraw(m,f,false,KIT);
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const T=[{n:'TAP-IN',p:10,c:'var(--t0)',pct:41,th:'25%+'},{n:'HEADER',p:30,c:'var(--t1)',pct:17,th:'<25%'},{n:'VOLLEY',p:60,c:'var(--t2)',pct:6.2,th:'<10%'},{n:'BICYCLE',p:85,c:'var(--t3)',pct:2.3,th:'<4%'},{n:'SCREAMER',p:100,c:'var(--t4)',pct:.4,th:'<1%'}];
const B=[100,25,10,4,1];
const wait=ms=>new Promise(r=>setTimeout(r,RM?0:ms));
const fmt=v=>v>=9.95?String(Math.round(v)):v.toFixed(1);
const ease=k=>1-Math.pow(1-k,3);
function tween(from,to,ms,cb){return new Promise(res=>{if(RM||ms<=0){cb(to);return res()}const t0=performance.now();(function s(n){const k=Math.min(1,(n-t0)/ms);cb(from+(to-from)*ease(k));k<1?requestAnimationFrame(s):res()})(t0)})}
function shake(el,n){if(RM)return;el.classList.remove('shake1','shake2','shake3');void el.offsetWidth;el.classList.add('shake'+n)}
function burst(host,el,n,spread=150){if(RM)return;const pr=host.getBoundingClientRect(),r=el.getBoundingClientRect(),x=r.left-pr.left+r.width/2,y=r.top-pr.top+r.height/2,cols=['#f2c230','#fbf6e8','#fff3a0'];
 for(let i=0;i<n;i++){const d=document.createElement('div');d.className='px';d.style.left=x+'px';d.style.top=y+'px';d.style.background=cols[i%3];if(i%3===0)d.style.width=d.style.height='4px';host.appendChild(d);
 const a=Math.random()*Math.PI*2,rr=spread*(.35+Math.random()*.65);d.animate([{transform:'translate(0,0)',opacity:1},{transform:`translate(${Math.cos(a)*rr}px,${Math.sin(a)*rr*.7+50}px)`,opacity:0}],{duration:650+Math.random()*350,easing:'cubic-bezier(.2,.8,.4,1)',fill:'forwards'});setTimeout(()=>d.remove(),1100)}}
const fadeUp=(el,d=0,ms=240)=>el.animate([{opacity:0,transform:'translateY(8px)'},{opacity:1,transform:'none'}],{duration:ms,delay:d,easing:'cubic-bezier(.23,1,.32,1)',fill:'forwards'});
const hide=el=>{el.getAnimations().forEach(a=>a.cancel());el.style.opacity=0};
async function countdown(tier,set,onCross,stall,ok){let cur=100;onCross(0);
 for(let i=1;i<=tier;i++){if(!ok())return;
  if(tier===4&&i===4){await tween(cur,1.3,420,set);cur=1.3;await stall();if(!ok())return}
  await tween(cur,B[i]-.001,i===1?420:300,set);cur=B[i];onCross(i);await wait(i===4?100:170)}
 if(!ok())return;await tween(cur,T[tier].pct,tier===4?260:440,set)}
// reels: '##.#' showing tens, ones, tenths (tens hidden under 10)
function reels(host,h){host.innerHTML=['r','r','.','r','%'].map(k=>k==='r'?`<div class="reel"><div class="st">${[...'0123456789'].map(d=>`<span>${d}</span>`).join('')}</div></div>`:`<span class="sep">${k}</span>`).join('');
 const rl=[...host.querySelectorAll('.reel')],st=rl.map(r=>r.querySelector('.st'));
 return{set(v){v=Math.min(99.9,v);const d=[Math.floor(v/10),Math.floor(v%10),Math.floor((v*10)%10)];rl[0].classList.toggle('off',d[0]===0);d.forEach((x,i)=>st[i].style.transform=`translateY(${-x*h}px)`)},
  snap(v){st.forEach(s=>s.style.transition='none');this.set(v);void host.offsetWidth;st.forEach(s=>s.style.transition='')},el:rl}}
// integer reels for points (3 digits)
function preels(host,h){host.innerHTML=[0,1,2].map(()=>`<div class="reel"><div class="st">${[...'0123456789'].map(d=>`<span>${d}</span>`).join('')}</div></div>`).join('');
 const rl=[...host.querySelectorAll('.reel')],st=rl.map(r=>r.querySelector('.st'));return{set(v){v=Math.round(v);const d=[Math.floor(v/100),Math.floor(v/10)%10,v%10];rl[0].classList.toggle('off',v<100);rl[1].classList.toggle('off',v<10);d.forEach((x,i)=>st[i].style.transform=`translateY(${-x*h}px)`)},el:rl}}
const CH='ABCDEFGHIJKLMNOPRSTUVWXYZ-!';
function flap(host,n){host.innerHTML='<span></span>'.repeat(n);const cells=[...host.children];
 return{clear(){cells.forEach(c=>{c.textContent='';c.style.color=''})},
  to(word,ok,col){const w=word.padEnd(n).slice(0,n);return Promise.all(cells.map((c,i)=>new Promise(res=>{let k=0;const spins=RM?0:3+i*2;const iv=setInterval(()=>{if(!ok()){clearInterval(iv);return res()}
   if(k>=spins){c.textContent=w[i]===' '?'':w[i];if(col)c.style.color=col;clearInterval(iv);c.animate([{transform:'scaleY(.2)'},{transform:'scaleY(1)'}],{duration:90,easing:'ease-out'});return res()}
   c.textContent=CH[Math.floor(Math.random()*CH.length)];k++},42)})))},cells}}
const joy=(u,ok)=>{let f=0;const iv=setInterval(()=>{if(!ok())return clearInterval(iv);u.style.backgroundImage=spr('joy',f++%2)},140);setTimeout(()=>clearInterval(iv),1600)};
const stallPulse=(el,prop,a,b)=>el.animate([{[prop]:a},{[prop]:b},{[prop]:a},{[prop]:b},{[prop]:a}],{duration:720,easing:'steps(4)'});

const V=[
{id:'S1',h:'C1 · Classic',p:'Your favourite, on the blue card. The reels roll the %, the flaps clack out the tier, and two tiles below show tier and points.',
 html:`<div class="bw"><div class="uni-s uni" data-u></div><div class="board"><div class="reels" data-r></div><div class="lbl" style="text-align:center;margin-top:10px">OF PLAYERS SAID THIS</div><div class="flap" data-f style="margin-top:18px"></div></div></div>
  <div class="tiles"><div class="tile"><span class="lbl">TIER</span><b data-tn>–</b></div><div class="tile"><span class="lbl">POINTS</span><b data-pt style="color:var(--gold)">0</b></div></div><button class="nxt" data-nx>NEXT QUESTION ▶</button>`},
{id:'S2',h:'C2 · Jumbotron',p:'A big LED stadium screen with the unicorn sitting on top. The % is made of light dots, and the tier scrolls across underneath like a stadium ticker.',
 html:`<div class="jt"><div class="uni-s uni" data-u></div><div class="led" data-led>100<small>%</small></div><div class="lbl jlab">OF PLAYERS SAID THIS</div><div class="marq"><div data-mq></div></div></div>
  <div class="under"><div class="why" data-why></div><div class="pt" data-pt>+100</div></div><button class="nxt" data-nx>NEXT QUESTION ▶</button>`},
{id:'S3',h:'C3 · Departure board',p:'Like a train station board. Every tier is a row, and as the % drops each row flips to SCORED. The row you reach flips to GOAL!',
 html:`<div class="pr"><span class="lbl">OF PLAYERS<br>SAID THIS</span><div class="reels" data-r></div></div>
  <div class="dep board"><div class="uni-s uni" data-u></div><div class="dh lbl"><span>TIER</span><span>NEEDS</span><span>PTS</span><span>STATUS</span></div><div data-rows></div></div><button class="nxt" data-nx>NEXT QUESTION ▶</button>`},
{id:'S4',h:'C4 · Matchday board',p:'A lighter cream board, like the old manual scoreboards. The % rolls down while the points roll up beside it, and the tier clacks in underneath.',
 html:`<div class="lb"><div class="uni-s uni" data-u></div><div class="two"><div class="cell"><span class="lbl">SAID THIS</span><div class="reels" data-r></div></div><div class="cell"><span class="lbl">POINTS</span><div class="reels" data-p></div></div></div><div class="flap" data-f></div></div>
  <p class="why" data-why></p><button class="nxt" data-nx>NEXT QUESTION ▶</button>`},
];
const row=document.getElementById('row'),qh=document.getElementById('qh').innerHTML,RUN={},TOK={};
V.forEach(v=>{const c=document.createElement('div');c.className='col';c.innerHTML=`<h2>${v.h}</h2><p>${v.p}</p><div class="ctrl"></div><div class="phone" id="${v.id}">${qh}${v.html}</div>`;row.appendChild(c);
 T.forEach((t,i)=>{const b=document.createElement('button');b.textContent=t.n;b.onclick=()=>RUN[v.id](i);c.querySelector('.ctrl').appendChild(b)});TOK[v.id]=0});
const why=t=>t.pct>=25?'A popular pick.':`Rarer than ${(100-t.pct).toFixed(t.pct<1?1:0)}% of answers.`;

// ---- C1
(()=>{const ph=document.getElementById('S1'),$=s=>ph.querySelector(s),R=reels($('[data-r]'),100),F=flap($('[data-f]'),8),u=$('[data-u]');
 RUN.S1=async tier=>{const me=++TOK.S1,ok=()=>me===TOK.S1,t=T[tier],tn=$('[data-tn]'),pt=$('[data-pt]');
  R.snap(99.9);F.clear();tn.textContent='–';tn.style.color='var(--mute)';pt.textContent='0';hide($('[data-nx]'));u.style.backgroundImage=spr('happy');
  await wait(350);if(!ok())return;
  await countdown(tier,v=>R.set(v),i=>{tn.textContent=T[i].n;tn.style.color=T[i].c;if(i>0){shake(ph,i>=3?2:1);tn.animate([{transform:'translateY(-6px)',opacity:.4},{transform:'none',opacity:1}],{duration:160,easing:'cubic-bezier(.23,1,.32,1)'})}},
   async()=>{u.style.backgroundImage=spr('wow',1);stallPulse($('.board'),'boxShadow','inset 0 0 0 3px #2a2638','inset 0 0 0 3px #f2c230');await wait(760)},ok);
  if(!ok())return;await F.to(t.n,ok,tier===4?'var(--gold)':null);if(!ok())return;tween(0,t.p,420,v=>pt.textContent='+'+Math.round(v));
  if(tier===4){shake(ph,3);burst(ph,$('[data-f]'),48);joy(u,ok)}else u.style.backgroundImage=spr(tier>=2?'joy':'happy');fadeUp($('[data-nx]'),400)}})();

// ---- C2
(()=>{const ph=document.getElementById('S2'),$=s=>ph.querySelector(s),u=$('[data-u]'),led=$('[data-led]'),mq=$('[data-mq]');
 RUN.S2=async tier=>{const me=++TOK.S2,ok=()=>me===TOK.S2,t=T[tier];
  led.innerHTML='100<small>%</small>';led.style.color='';mq.getAnimations().forEach(a=>a.cancel());mq.textContent='';[$('[data-pt]'),$('[data-why]'),$('[data-nx]')].forEach(hide);u.style.backgroundImage=spr('happy');
  await wait(350);if(!ok())return;
  // the ticker scrolls the current tier while counting
  const tick=w=>{mq.textContent=w;mq.style.color='';mq.getAnimations().forEach(a=>a.cancel());const W=mq.parentElement.clientWidth;mq.animate([{transform:`translateX(${W}px)`},{transform:`translateX(${(W-mq.offsetWidth)/2}px)`}],{duration:RM?1:260,easing:'cubic-bezier(.23,1,.32,1)',fill:'forwards'})};
  await countdown(tier,v=>led.innerHTML=fmt(v)+'<small>%</small>',i=>{tick(T[i].n);mq.style.color=T[i].c;if(i>0)shake(ph,i>=3?2:1)},
   async()=>{u.style.backgroundImage=spr('wow',1);stallPulse($('.jt'),'boxShadow','inset 0 0 0 4px #3a3550, 0 6px 0 rgba(0,0,0,.35)','inset 0 0 0 4px #f2c230, 0 6px 0 rgba(0,0,0,.35)');await wait(760)},ok);
  if(!ok())return;$('[data-pt]').textContent='+'+t.p;$('[data-why]').textContent=why(t);
  if(tier===4){led.style.color='var(--gold)';mq.textContent='★ SCREAMER ★';tick('★ SCREAMER ★');mq.style.color='var(--gold)';shake(ph,3);burst(ph,led,52,170);joy(u,ok);
   $('[data-pt]').animate([{opacity:0,transform:'scale(1.6)'},{opacity:1,transform:'scale(.94)',offset:.65},{opacity:1,transform:'scale(1)'}],{duration:380,easing:'cubic-bezier(.3,0,.2,1)',fill:'forwards'})}
  else{u.style.backgroundImage=spr(tier>=2?'joy':'happy');fadeUp($('[data-pt]'))}
  fadeUp($('[data-why]'),160);fadeUp($('[data-nx]'),420)}})();

// ---- C3
(()=>{const ph=document.getElementById('S3'),$=s=>ph.querySelector(s),R=reels($('[data-r]'),62),u=$('[data-u]'),rows=$('[data-rows]');
 rows.innerHTML=T.slice().reverse().map(t=>`<div class="dr" style="--c:${t.c}"><span class="tn">${t.n}</span><span class="th">${t.th}</span><span class="pv">${t.p}</span><span class="stt"><span class="flap"></span></span></div>`).join('');
 const dr=[...rows.children].reverse(),FL=dr.map(d=>flap(d.querySelector('.flap'),6));
 RUN.S3=async tier=>{const me=++TOK.S3,ok=()=>me===TOK.S3;
  R.snap(99.9);dr.forEach((d,i)=>{d.classList.remove('on','goal');FL[i].clear()});hide($('[data-nx]'));u.style.backgroundImage=spr('happy');
  await wait(350);if(!ok())return;
  await countdown(tier,v=>R.set(v),i=>{dr[i].classList.add('on');FL[i].to('SCORED',ok,'#3fd17f');if(i>0)shake(ph,i>=3?2:1)},
   async()=>{u.style.backgroundImage=spr('wow',1);stallPulse(dr[4],'backgroundColor','rgba(242,194,48,0)','rgba(242,194,48,.25)');await wait(760)},ok);
  if(!ok())return;await wait(200);dr[tier].classList.add('goal');await FL[tier].to('GOAL!',ok,'#f2c230');
  if(tier===4){shake(ph,3);burst(ph,dr[4],48);R.el.forEach(r=>r.animate([{filter:'brightness(1)'},{filter:'brightness(1.8)'},{filter:'brightness(1)'}],{duration:400}));joy(u,ok)}else u.style.backgroundImage=spr(tier>=2?'joy':'happy');
  fadeUp($('[data-nx]'),300)}})();

// ---- C4
(()=>{const ph=document.getElementById('S4'),$=s=>ph.querySelector(s),R=reels($('[data-r]'),66),P=preels($('[data-p]'),66),F=flap($('[data-f]'),8),u=$('[data-u]');
 RUN.S4=async tier=>{const me=++TOK.S4,ok=()=>me===TOK.S4,t=T[tier];
  R.snap(99.9);P.set(0);P.el.forEach(r=>r.classList.remove('gold'));F.clear();[$('[data-why]'),$('[data-nx]')].forEach(hide);u.style.backgroundImage=spr('happy');
  await wait(350);if(!ok())return;
  await countdown(tier,v=>R.set(v),i=>{P.set(T[i].p);if(i>0)shake(ph,i>=3?2:1)},
   async()=>{u.style.backgroundImage=spr('wow',1);stallPulse($('.lb'),'boxShadow','0 5px 0 rgba(0,0,0,.35), 0 0 0 0 #f2c230','0 5px 0 rgba(0,0,0,.35), 0 0 0 4px #f2c230');await wait(760)},ok);
  if(!ok())return;await F.to(t.n,ok,tier===4?'var(--gold)':null);if(!ok())return;$('[data-why]').textContent=why(t);
  if(tier===4){P.el.forEach(r=>r.classList.add('gold'));shake(ph,3);burst(ph,$('[data-f]'),48);joy(u,ok)}else u.style.backgroundImage=spr(tier>=2?'joy':'happy');
  fadeUp($('[data-why]'),120);fadeUp($('[data-nx]'),400)}})();
['S1','S2','S3','S4'].forEach(k=>RUN[k](4));
</script>
</body></html>
