<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Christmas loading</title>
<style>
@font-face{font-family:'Jersey 10';src:url(/fonts/jersey10.woff2)}@font-face{font-family:VT323;src:url(/fonts/vt323.woff2)}
html,body{margin:0;height:100%}
.sp{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;overflow:hidden;
 background:radial-gradient(ellipse at 50% 35%,#24407a 0%,#16295a 55%,#0d1838 100%);color:#fff}
#snow{position:absolute;inset:0}
.moon{position:absolute;right:12%;top:10%;width:54px;height:54px;background:#fff6d8;box-shadow:0 0 0 6px rgba(255,246,216,.15),0 0 0 14px rgba(255,246,216,.07);clip-path:polygon(25% 0,75% 0,100% 25%,100% 75%,75% 100%,25% 100%,0 75%,0 25%)}
.sp-t{position:relative;font:400 clamp(52px,14vw,84px)/1 'Jersey 10';letter-spacing:.03em;color:#f2c230;text-shadow:3px 0 0 #1d1a2b,-3px 0 0 #1d1a2b,0 3px 0 #1d1a2b,0 -3px 0 #1d1a2b,3px 3px 0 #1d1a2b,-3px 3px 0 #1d1a2b,3px -3px 0 #1d1a2b,-3px -3px 0 #1d1a2b,0 7px 0 #1d1a2b}
.sp-t:after{content:"";position:absolute;left:-4px;right:-4px;top:-8px;height:12px;background:#fff;clip-path:polygon(0 100%,0 40%,6% 0,14% 55%,24% 10%,34% 60%,46% 5%,58% 55%,70% 0,82% 50%,92% 8%,100% 45%,100% 100%,92% 70%,80% 95%,66% 70%,50% 100%,34% 75%,18% 100%)}
.run{position:relative;width:min(86vw,380px);height:150px}
.bar{position:absolute;left:0;right:0;bottom:6px;height:24px;background:#fffaf0;border:3px solid #1d1a2b;box-shadow:4px 4px 0 #1d1a2b;
 background-image:linear-gradient(90deg,#fff 0 50%,#fffaf0 50%);}
.fill{position:absolute;left:0;top:0;bottom:0;width:0;background:repeating-linear-gradient(-45deg,#d62828 0 10px,#fff 10px 20px)}
/* the team: reindeer unicorn in front, sleigh with Horacio behind, riding the end of the fill */
.team{position:absolute;bottom:26px;left:0;width:250px;height:120px;transform:translateX(-250px)}
.u{position:absolute;right:0;bottom:0;width:96px;height:80px;background:center/contain no-repeat;image-rendering:pixelated}
.sleigh{position:absolute;left:0;bottom:2px;width:132px;height:110px}
.sleigh img{position:absolute;left:22px;bottom:30px;width:96px;height:96px;image-rendering:pixelated}
.sleigh svg{position:absolute;left:0;bottom:0;width:132px;height:66px;image-rendering:pixelated}
.rein{position:absolute;bottom:40px;left:118px;width:66px;height:2px;background:#5a3a22;transform-origin:left;transform:rotate(-6deg)}
.bells{position:absolute;bottom:36px;left:140px;width:44px;height:6px;background:radial-gradient(circle,#f2c230 2px,transparent 2.5px) 0 0/11px 6px}
.m{font:400 15px/1.3 VT323,monospace;color:#cfd8f2;letter-spacing:.06em;text-transform:uppercase;position:relative}
.bob{animation:bob .32s steps(2) infinite}@keyframes bob{50%{transform:translateY(-2px)}}
</style></head><body>
<div class="sp"><canvas id="snow"></canvas><div class="moon"></div>
<div class="sp-t">UNICORNER</div>
<div class="run"><div class="bar"><div class="fill" id="fill"></div></div>
 <div class="team" id="team">
  <div class="rein"></div><div class="bells"></div>
  <div class="sleigh bob"><img src="/blackjack/art/xmas/horacio-laughing.png" alt="">
   <svg viewBox="0 0 44 22" shape-rendering="crispEdges" id="sl"></svg></div>
  <i class="u" id="u"></i>
 </div></div>
<div class="m">Horacio's on his way with the presents…</div></div>
<script src="/duel/sprites.js"></script>
<script>
// pixel sleigh, 44x22: red body, gold trim, curled runner
const S=document.getElementById('sl'),r=(x,y,w,h,c)=>S.insertAdjacentHTML('beforeend',`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${c}"/>`);
const K='#1d1a2b',R='#d62828',D='#a51d1d',G='#f2c230',g='#c99a1a';
r(2,0,6,12,K);r(3,1,4,10,R);r(3,1,1,10,D);           // tall back
r(2,10,34,9,K);r(3,11,32,7,R);r(3,16,32,2,D);          // body
r(34,8,6,9,K);r(35,9,4,7,R);r(38,6,3,4,K);r(39,7,1,2,R);// front curl
r(3,11,32,1,G);r(8,13,22,1,G);r(17,12,4,3,G);r(18,13,2,1,R); // trim + crest
r(6,19,2,2,K);r(30,19,2,2,K);                          // struts
r(0,21,42,1,K);r(1,20,2,1,K);r(41,18,1,3,K);r(42,17,1,2,K);r(2,20,39,1,'#d8dde8'); // runner
// unicorn in the Reindeer kit, galloping (2 frames)
const kit=KITS.find(k=>k.id==='xm-reindeer'),fr=[0,1].map(f=>spriteDraw('happy',f,false,kit));
const u=document.getElementById('u');let f=0;setInterval(()=>{f^=1;u.style.backgroundImage=fr[f]},160);u.style.backgroundImage=fr[0];
// progress: the team rides the end of the fill, then loops for the demo
const fill=document.getElementById('fill'),team=document.getElementById('team'),run=document.querySelector('.run');
const loop=t=>{const p=((t/1000)%3.6)/3,q=Math.min(1,p),e=1-Math.pow(1-q,2.2),W=run.clientWidth;
 fill.style.width=(e*100)+'%';team.style.transform=`translateX(${e*W-250+30}px)`;requestAnimationFrame(loop)};requestAnimationFrame(loop);
// snow
const c=document.getElementById('snow'),x=c.getContext('2d');let fl=[];const rs=()=>{c.width=innerWidth;c.height=innerHeight;fl=[...Array(70)].map(()=>[Math.random()*c.width,Math.random()*c.height,1+Math.random()*2.5,.3+Math.random()*.8])};rs();
(function sn(){x.clearRect(0,0,c.width,c.height);x.fillStyle='#fff';for(const p of fl){p[1]+=p[3];p[0]+=Math.sin(p[1]/30)*.3;if(p[1]>c.height)p[1]=-4;x.fillRect(p[0]|0,p[1]|0,p[2]|0||1,p[2]|0||1)}requestAnimationFrame(sn)})();
</script></body></html>
