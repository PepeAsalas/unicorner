<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Advent preview</title>
<style>
@font-face{font-family:'Jersey 10';src:url(/fonts/jersey10.woff2)}@font-face{font-family:VT323;src:url(/fonts/vt323.woff2)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#1f5e39 url(/bg/pitch-tall.webp) center top/cover fixed;font:400 18px/1.3 VT323,monospace;color:#f6e7c4}
@media (min-width:900px){body{background-image:url(/bg/pitch-wide.webp)}}
.wrap{max-width:760px;margin:0 auto;padding:20px 14px 40px}
.card{position:relative;background:repeating-linear-gradient(0deg,#5b3a22 0 30px,#4d301b 30px 32px,#64412a 32px 62px,#4d301b 62px 64px);border:4px solid #000;box-shadow:5px 5px 0 rgba(0,0,0,.4);padding:18px}
h1{margin:0 0 4px;font:400 34px/1 'Jersey 10',monospace;color:#fff;text-shadow:3px 3px 0 #000}
.sub{margin:0 0 14px;color:#e9dfc2}
.box{position:relative;width:min(100%,360px);margin:0 auto;aspect-ratio:960/1200;background:url(/xmas/advent-closed.png) center/100% 100% no-repeat;image-rendering:pixelated}
.box button{all:unset;position:absolute;cursor:pointer;display:grid;place-items:center;font:400 15px/1 'Jersey 10',monospace;color:#3a2414;transition:transform .12s ease-out}
.box button:hover{background:rgba(255,246,192,.25)}.box button:active{transform:scale(.95)}
.box button.seen{background:url(/xmas/advent-open.png) no-repeat}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;margin-top:16px}
.list button{all:unset;cursor:pointer;padding:8px 10px;background:#f6eed8;color:#1d1a2b;border:3px solid #000;font:400 16px/1.1 VT323,monospace;transition:transform .12s ease-out}
.list button:active{transform:scale(.97)}.list b{font:400 18px 'Jersey 10',monospace;color:#c8473b;margin-right:6px}
.note{margin-top:14px;font-size:15px;color:#e9dfc2}
</style></head><body><div class="wrap"><div class="card">
<h1>Advent calendar: preview</h1>
<p class="sub">Every door is playable now. Votes show a pretend result, and nothing here touches your real progress or kits.</p>
<div class="box" id="box"></div>
<div class="list" id="list"></div>
<p class="note">Tap a drawer or a day below. On the real site a door opens once you've played that day's Daily 5.</p>
</div></div>
<script src="/duel/sprites.js"></script>
<script>
window.ADVENT_PREVIEW=1;
window.L=(en)=>en; window.xmToday=()=>'2026-12-24'; window.sprite=spriteDraw;
const LABEL={1:'Welcome',2:'Penalty in the snow',3:'Secret kit: crown',4:'Vote: new kit',5:'Christmas quiz',6:'Catch the presents',7:'Vote: retired kit',8:'Your year',9:'Secret kit: scarf',10:'Clásico quiz',11:'Emoji club',12:'Vote: Christmas theme',13:'Community goal',14:'Retired kit returns',15:'Secret kit: jumper',16:'Higher or lower',17:'Heartbreak quiz',18:'Vote: best goal',19:'Penalty: hard mode',20:'Emoji club 2',21:'Secret kit: boots',22:'New kit revealed',23:'Catch the presents ×2',24:'Finale'};
const CX=[150,320,490,660],CY=[300,447,593,740,886,1032],DW=155,DH=132,pc=(v,t)=>(v/t*100).toFixed(2)+'%';
document.getElementById('box').innerHTML=[...Array(24)].map((_,i)=>{const x=CX[i%4],y=CY[i>>2];return`<button type="button" data-n="${i+1}" style="left:${pc(x,960)};top:${pc(y,1200)};width:${pc(DW,960)};height:${pc(DH,1200)}" aria-label="Door ${i+1}"></button>`}).join('');
document.getElementById('list').innerHTML=Object.entries(LABEL).map(([n,t])=>`<button type="button" data-n="${n}"><b>${n}</b>${t}</button>`).join('');
document.addEventListener('click',e=>{const b=e.target.closest('[data-n]');if(b&&window.ucAdvent)window.ucAdvent.open(+b.dataset.n)});
</script>
<script src="/xmas/advent.js"></script>
</body></html>
