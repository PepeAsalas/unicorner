<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Unicorner Football Money Tycoon (demo)</title>
<meta name="description" content="Build a ridiculous football empire from a muddy pitch. A free demo from Unicorner.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1a1030">
<link rel="icon" href="/favicon-32.png" sizes="32x32">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600;700;800&family=Jersey+10&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tycoon.css">
</head>
<body>
<div class="app">
  <header class="top">
    <a class="back" href="/">← Unicorner</a>
    <span class="demo">DEMO</span>
  </header>
  <section class="bank" aria-live="polite">
    <div class="money" id="money">€0</div>
    <div class="rate" id="rate">€0 per second</div>
  </section>
  <div class="stage" id="stage">
    <canvas id="map" aria-label="Your football district. Tap the player doing keepy-uppies to earn money."></canvas>
    <div class="floats" id="floats" aria-hidden="true"></div>
    <button type="button" class="event-badge" id="eventBadge" hidden></button>
  </div>
  <p class="ticker" id="ticker">Tap the player doing keepy-uppies to earn money.</p>
  <nav class="tabs" role="tablist">
    <button type="button" role="tab" data-tab="club" aria-selected="true" class="on">Club</button>
    <button type="button" role="tab" data-tab="upgrades" aria-selected="false">Upgrades <b id="upCount"></b></button>
    <button type="button" role="tab" data-tab="stars" aria-selected="false">Stars <b id="starCount"></b></button>
  </nav>
  <section class="panel" id="panel"></section>
</div>
<div class="modal" id="modal" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<script src="content.js"></script>
<script src="game.js"></script>
</body>
</html>
